<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Win Predictor</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div id="video-background">
        <video autoplay muted loop id="background-video">
            <source src="ipl.mp4" type="video/mp4">
        </video>
    </div>

<div class="container">

    <div class="card">

        <h1>🏏 IPL WIN PREDICTOR</h1>
        <p class="subtitle">Predict live match winning probability using AI</p>

        <div class="grid">

            <div class="input-group">
                <label>Batting Team</label>

                <select id="batting_team">

                    <option>Chennai Super Kings</option>
                    <option>Mumbai Indians</option>
                    <option>Royal Challengers Bangalore</option>
                    <option>Kolkata Knight Riders</option>
                    <option>Sunrisers Hyderabad</option>
                    <option>Delhi Capitals</option>
                    <option>Punjab Kings</option>
                    <option>Rajasthan Royals</option>

                </select>

            </div>

            <div class="input-group">

                <label>Bowling Team</label>

                <select id="bowling_team">

                    <option>Chennai Super Kings</option>
                    <option>Mumbai Indians</option>
                    <option>Royal Challengers Bangalore</option>
                    <option>Kolkata Knight Riders</option>
                    <option>Sunrisers Hyderabad</option>
                    <option>Delhi Capitals</option>
                    <option>Punjab Kings</option>
                    <option>Rajasthan Royals</option>

                </select>

            </div>

            <div class="input-group">

                <label>City</label>

                <select id="city">

                    <option>Mumbai</option>
                    <option>Delhi</option>
                    <option>Hyderabad</option>
                    <option>Bangalore</option>
                    <option>Chennai</option>
                    <option>Kolkata</option>
                    <option>Jaipur</option>
                    <option>Pune</option>
                    <option>Ahmedabad</option>
                    <option>Indore</option>
                    <option>Mohali</option>
                    <option>Dubai</option>
                    <option>Sharjah</option>
                    <option>Abu Dhabi</option>

                </select>

            </div>

            <div class="input-group">

                <label>Target</label>

                <input type="number" id="target" placeholder="Target">

            </div>

            <div class="input-group">

                <label>Current Score</label>

                <input type="number" id="score" placeholder="Current Score">

            </div>

            <div class="input-group">

                <label>Overs Completed</label>

                <input type="text" id="overs" placeholder="Eg. 14.2">

            </div>

            <div class="input-group">

                <label>Wickets Lost</label>

                <select id="wickets">

                    <option>0</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                    <option>8</option>
                    <option>9</option>

                </select>

            </div>

        </div>

        <button id="predictBtn">

            Predict Winner

        </button>

    </div>

    <div class="result-card" id="resultCard">

        <h2>Winning Probability</h2>

        <div class="team-result">

            <h3 id="batTeamName">Team A</h3>

            <div class="progress">

                <div class="progress-bar" id="batBar"></div>

            </div>

            <span id="batPercent">0%</span>

        </div>

        <div class="team-result">

            <h3 id="bowlTeamName">Team B</h3>

            <div class="progress">

                <div class="progress-bar" id="bowlBar"></div>

            </div>

            <span id="bowlPercent">0%</span>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
